name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover tests -v
      - name: Smoke test (demo pipeline)
        run: python dual_color_wave.py --demo --demo-height 8 --output output_ci
      - name: Verify STL is watertight
        run: |
          python - <<'PY'
          import trimesh
          for name in ("wave_white", "wave_black"):
              m = trimesh.load(f"output_ci/{name}.stl", force="mesh")
              assert m.is_watertight, f"{name}.stl is not watertight"
              assert m.is_winding_consistent, f"{name}.stl winding inconsistent"
              assert m.volume > 0, f"{name}.stl volume not positive"
              print(name, "OK:", len(m.faces), "faces")
          PY
        shell: bash
